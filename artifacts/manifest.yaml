schema_version: paper_release_v4
method: IEDG
scope: formal main-paper checkpoints and registered evaluation inputs
artifact_root: artifacts

distribution:
  layout: flat
  bundled: true

checkpoint_format:
  payload: raw_pytorch_state_dict
  weights: ema
  inference_only: true
  resumable_training_checkpoint: false

evaluation_protocol:
  mode: paper
  selection: explicit_checkpoint
  reference_split: test
  reference_seed: 0
  rollout_seed: 2701
  rollout_samples: 4096
  guidance_strength: 1.0
  sampling_steps: 256
  evaluation_replicates: 1
  histogram_binning: fixed_registered_edges

results:
  ising16_beta028:
    method: iedg
    evaluator: lattice
    config: configs/ising16/iedg_beta028.yaml
    initialization: analytic_uniform
    problem:
      kind: ising
      lattice_size: 16
      beta: 0.28
      J: 1.0
      h: 0.0
    checkpoint_step: 34000
    checkpoint: iedg_ising16_beta028_step034000_ema.pt
    training_gpu: NVIDIA RTX A6000
    evaluation:
      generated_samples: eval_ising16_beta028_generated.pt
      reference_samples: eval_ising16_beta028_reference.pt
      metrics: eval_ising16_beta028_metrics.json
      reference_num_samples: 4096
      reference_sample_cfg:
        sampler: swendsen_wang
        batch_size: 128
        num_collect: 32
        burn_in: 8192
        collect_every: 128
        seed: 0

